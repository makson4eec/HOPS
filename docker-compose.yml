name: hops

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-application-environment: &application-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-hops}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-hops}?schema=public
  APP_URL: ${APP_URL:-http://localhost:3000}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUST_PROXY: ${TRUST_PROXY:-false}
  ONE_C_MODE: ${ONE_C_MODE:-test}
  ONE_C_BASE_URL: ${ONE_C_BASE_URL:-}
  ONE_C_TOKEN: ${ONE_C_TOKEN:-}
  NODE_ENV: production

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hops}
      POSTGRES_USER: ${POSTGRES_USER:-hops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    shm_size: 256mb
    logging: *logging

  migrator:
    build:
      context: .
      target: migrator
    environment: *application-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *logging

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    init: true
    environment: *application-environment
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    depends_on:
      migrator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *logging

  sync-worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment: *application-environment
    depends_on:
      migrator:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging: *logging

volumes:
  postgres-data:
